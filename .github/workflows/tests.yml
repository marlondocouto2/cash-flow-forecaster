name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - run: pytest -q
      - name: Pipeline, ladder versions only (Chronos-2 downloads a 0.5 GB model; run it locally)
        run: python scripts/run_pipeline.py --versions 1,2,3,4,5
